<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>now — valentin</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="now">

<div class="glow"></div>
<div class="stars" id="stars"></div>
<nav id="nav"></nav>

<main class="page page-wide">
  <div class="eyebrow">/now</div>
  <h1>live room<span class="end-dot">.</span></h1>
  <p class="sub">what the room knows right now.</p>

  <div class="bento">
    <div class="bcard span2">
      <div class="bhead"><span class="bicon">◉</span>current status</div>
      <div class="bstatus">
        <span class="bdot" id="lrDot"></span>
        <span class="bbig" id="lrStatus">do not disturb</span>
        <span class="bchip" id="lrDevice">desktop</span>
      </div>
      <div class="bsub" id="lrMessage">im here</div>
    </div>

    <div class="bcard">
      <div class="bhead"><span class="bicon">✽</span>room count</div>
      <div class="bnumber"><b id="lrCount">–</b><span>visitors</span></div>
      <div class="bsub">how many people are currently here</div>
    </div>

    <div class="bcard span2">
      <div class="bhead"><span class="bicon">❖</span>discord activity</div>
      <div class="bsub" id="lrActivity">got no activity running rn</div>
    </div>

    <div class="bcard">
      <div class="bhead"><span class="bicon">♪</span>spotify</div>
      <div class="bsub" id="lrSpotify">nothing playing on spotify at the moment.</div>
    </div>
  </div>

  <div class="page-foot">
    <a href="index.html">← home</a>
    <a href="log.html">the log →</a>
  </div>
</main>

<script src="site.js"></script>
</body>
</html>
